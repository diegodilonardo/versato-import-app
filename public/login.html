<!doctype html>
<html lang="es">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1">
 <title>Ingresar · Versato</title>
 <link rel="stylesheet" href="/styles.css?v=20261126-login-estilo">
 <script src="/login.js" defer></script>
</head>
<body class="login-body">
 <main class="auth-page login-page">
  <a class="brand login-brand" href="/login" aria-label="Versato Import">versato<span> / import</span></a>
  <section class="card login-card" aria-labelledby="login-titulo">
   <div class="login-symbol" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></svg></div>
   <p class="eyebrow">TU ESPACIO DE TRABAJO</p>
   <h1 id="login-titulo">Iniciar sesión</h1>
   <p class="login-intro">Ingresá con tu usuario personal para continuar.</p>
   <form id="login-form" class="login-form">
    <label for="usuario">Usuario<span class="login-field"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/></svg><input id="usuario" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="64" placeholder="Tu nombre de usuario" required autofocus></span></label>
    <label for="clave">Contraseña<span class="login-field"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><input id="clave" name="password" type="password" autocomplete="current-password" maxlength="128" placeholder="Ingresá tu contraseña" required></span></label>
    <button type="submit">Ingresar<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button>
    <p id="mensaje" class="login-message" role="status" aria-live="polite"></p>
   </form>
   <p class="login-help">¿Necesitás acceso? Consultá al administrador.</p>
  </section>
  <p class="login-footer">Facturas, precios y stock en un solo lugar.</p>
 </main>
</body>
</html>
